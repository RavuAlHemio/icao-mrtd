[package]
name = "icao-mrtd"
version = "0.1.0"
edition = "2021"

[dependencies]
aes = { version = "0.9" }
block-padding = { version = "0.4" }
cbc = { version = "0.2" }
cipher = { version = "0.5" }
cmac = { version = "0.8" }
crypto-bigint = { version = "0.7", features = ["alloc", "zeroize"] }
ctutils = { version = "0.4" }
des = { version = "0.9" }
digest = { version = "0.11" }
elliptic-curve = { version = "0.14.0-rc.31", features = ["ecdh", "sec1"] }
hex-literal = { version = "1.1" }
hmac = { version = "0.13" }
pcsc = { version = "2.9" }
rand = { version = "0.10" }
rasn = { version = "0.28" }
retail-mac = { version = "0.1" }
sha1 = { version = "0.11" }
sha2 = { version = "0.11" }
smallstr = { version = "0.3" }
smallvec = { version = "1.15", features = ["const_generics"] }
tracing = { version = "0.1" }
zeroize = { version = "1.8" }
zeroize_derive = { version = "1.4" }
